apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  namespace: aboli
spec:
  replicas: 3
  selector: 
    matchExpressions:
      - key: app
        operator: In
        values:
          - item
  template:
    metadata:
      labels:
        app: item
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          command: ["/bin/bash"]
          args: ["-c","echo","hello"]
          ports:
            - containerPort: 80
              name: http

