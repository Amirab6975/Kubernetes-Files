apiVersion: v1
kind: Service
metadata:
  name: nginx-srv
  namespace: aboli
spec:
  sessionAffinity: ClientIP
  ports:
    - port: 8080
      targetPort: http
      name: http8080
    - port: 8081
      targetPort: https
      name: http8081
    - port: 8082
      targetPort: 80
      name: http8082
    - port: 8083
      targetPort: 80
      name: http8083
  selector:
    app: item
