apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  namespace: aboli
spec:
  replicas: 3
  selector: 
    matchExpressions:
      - key: app
        operator: In
        values:
          - item
  template:
    metadata:
      labels:
        app: item
    spec:
      containers:
        - name: nginx
          image: nginx
          readinessProbe:
            exec:
              command:
                - ls
                - /var/ready
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https

