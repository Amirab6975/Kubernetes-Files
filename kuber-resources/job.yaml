apiVersion: batch/v1
kind: Job
metadata:
  name: hello
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: item
    spec:
      containers:
        - name: hello
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
          - /bin/sh
          - -c
          - date; echo hello from kubernetes cluster
      restartPolicy: OnFailure

