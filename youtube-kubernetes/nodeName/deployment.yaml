apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-kube

spec:
  selector:
    matchLabels:
      app: hello-kube

  template:
    metadata:
      labels:
        app: hello-kube
    spec:
      nodeName: worker1
      containers:
        - name: web
          image: amirab10/hello_kube:1.0.0
